name: Build and Release

on:
  push:
    branches: ['**']  # Trigger on pushes to all branches

permissions:
  contents: write  # Required for creating releases

env:
  LC_ALL: C  # Set consistent locale for build environment

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full commit history

      - name: Add upstream remote  # We need to fetch the upstream source to be able to create the changelog of our own changes
        run: |
          git remote add upstream https://github.com/keyboardio/Chrysalis-Firmware-Bundle
          git fetch upstream
          git checkout ${{ github.ref }}  # Checkout the branch of the commit again to make sure we are operation on that one

      - name: Configure Git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Get commit SHA
        id: sha
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Cache arduino dep downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace}}/.arduino/downloads
          key: ${{ runner.os }}-arduino-downloads

      - name: Setup build env
        run: make setup

      - name: Build software
        run: make hupfdule-model100 KALEIDOSCOPE_TEMP_PATH=${{ github.workspace}}/.kaleidoscope-temp  # Only build the hupfdule-model100 firmware

      # FIXME: Do we need this? Do we need to adapt this?
      - name: Collect the commit SHAs of the build
        run: make collect-build-info

      - name: Add all commit logs to changelog     # Add all our commit logs to the changelog
        run: make changelog > output/firmware-changelog.md

      - run: ls -lha output/*

      - name: Create release with firmware assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate unique tag name
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          TAG_NAME="commit-$SHORT_SHA-$TIMESTAMP"

          ## Tag the commit
          #git tag -a $TAG_NAME -m "Release for $COMMIT_SHA"
          #git push origin $TAG_NAME

          # Create release and attach firmware files directly
          gh release create $TAG_NAME \
            --title "Hupfdule m100 Firmware $(make version)" \
            --notes "Automated release" \
            -F output/release-notes.md \
            output/*/*.bin  # Path to your built firmware file(s)
