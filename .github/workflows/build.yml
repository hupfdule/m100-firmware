name: Build and Release

on:
  push:
    branches: ['hupfdule-dev']   # Trigger on pushes to the hupfdule branch
  pull_request:
    branches: ['hupfdule-dev']   # Trigger on PRs to the hupfdule branch

permissions:
  contents: write  # Required for creating releases

env:
  LC_ALL: C

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full commit history

      - name: Add upstream remote  # We need to fetch the upstream source to be able to create the changelog of our own changes
        run: |
          git remote add upstream https://github.com/keyboardio/Chrysalis-Firmware-Bundle
          git fetch upstream
          git checkout ${{ github.ref }}  # Checkout the branch of the commit again to make sure we are operation on that one

      - name: Configure Git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Get commit SHA
        id: sha
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Cache arduino dep downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace}}/.arduino/downloads
          key: ${{ runner.os }}-arduino-downloads

      - name: Setup build env
        run: make setup

      - name: Build software
        run: make hupfdule-model100 KALEIDOSCOPE_TEMP_PATH=${{ github.workspace}}/.kaleidoscope-temp  # Only build the hupfdule-model100 firmware

      - name: Generate the release-notes file
        run: make collect-build-info

      - name: Add all commit logs to changelog
        run: make changelog > output/firmware-changelog.md

      - name: Package up the artifacts
        shell: bash
        run: |
          tar czvf firmware-files.tar.gz -C output/ .

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate unique tag name with commit SHA and timestamp
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          TAG_NAME="v$TIMESTAMP-$SHORT_SHA"

          # Create and push the tag first
          git tag -a $TAG_NAME -m "Release for $COMMIT_SHA"
          git push origin $TAG_NAME

          # Create GitHub release
          gh release create $TAG_NAME \
            --repo ${{ github.repository }} \
            --title "Hupfdule m100 Firmware $(make version)" \
            --target $COMMIT_SHA \
            --notes "$(git log -1 --pretty=%B)" \
            --notes-file output/release-notes.md \
            --latest \
            output/*/*.bin \
            firmware-files.tar.gz

